services:
  app:
    build: .
    image: gestion-escolar:error418
    container_name: gestion_escolar_app
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db_docker

  db_docker:
    image: mysql:8.4
    container_name: gestion_escolar_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/sql/docker_db.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: